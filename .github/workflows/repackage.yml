name: repackage

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # 매주 월요일 06:00 UTC — 업스트림 새 버전 확인

permissions:
  contents: write   # 릴리스 생성/에셋 교체

env:
  NTFY_URL: ${{ secrets.NTFY_URL }}       # 전체 토픽 URL (예: https://notify.eli.kr/sidebars). 미설정 시 알림 스킵.
  NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}   # self-hosted 인증용 Bearer 토큰 (선택)
  # 자동 업데이트용 고정 URL — 'latest' 태그 릴리스의 에셋을 --clobber 로 교체하므로 영구 불변.
  UPDATE_URL: "https://github.com/sushistack/bitwarden-sidebar-icon/releases/download/latest/updates.json"
  XPI_URL: "https://github.com/sushistack/bitwarden-sidebar-icon/releases/download/latest/bitwarden-icon.xpi"

jobs:
  repackage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick jq
          npm install --global web-ext

      - name: Repackage (swap icons only)
        env:
          BUILD_REV: ${{ github.run_number }}
        run: bash repackage.sh icon.png

      - name: Read versions
        id: v
        run: |
          echo "upstream=$(cat dist/UPSTREAM)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat dist/VERSION)"   >> "$GITHUB_OUTPUT"

      - name: Already shipped this upstream?
        id: check
        run: |
          cur=$(curl -fsSL "$UPDATE_URL" | jq -r '.addons["bitwarden-icon@sushistack"].updates[0].version' 2>/dev/null || echo "")
          if [ "${cur%.*}" = "${{ steps.v.outputs.upstream }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ upstream ${{ steps.v.outputs.upstream }} already shipped ($cur) — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign with AMO (unlisted)
        if: steps.check.outputs.exists == 'false'
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          web-ext sign \
            --source-dir=dist/src \
            --artifacts-dir=./signed \
            --channel=unlisted \
            --api-key="$WEB_EXT_API_KEY" \
            --api-secret="$WEB_EXT_API_SECRET"

      - name: Build updates.json + stable-named xpi
        if: steps.check.outputs.exists == 'false'
        run: |
          cp signed/*.xpi bitwarden-icon.xpi
          ver="${{ steps.v.outputs.version }}"
          cat > updates.json <<EOF
          {
            "addons": {
              "bitwarden-icon@sushistack": {
                "updates": [
                  { "version": "$ver", "update_link": "$XPI_URL" }
                ]
              }
            }
          }
          EOF

      - name: Publish to 'latest' release (stable URLs)
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "latest" \
                 --notes "자동 업데이트 채널. 빌드마다 bitwarden-icon.xpi + updates.json 을 교체한다."
          gh release upload latest bitwarden-icon.xpi updates.json --clobber

      # ✅ Case 1 — build + release succeeded, a new version shipped.
      - name: Notify success (ntfy)
        if: steps.check.outputs.exists == 'false' && env.NTFY_URL != ''
        run: |
          AUTH=(); [ -n "${NTFY_TOKEN:-}" ] && AUTH=(-H "Authorization: Bearer $NTFY_TOKEN")
          REL="${{ github.server_url }}/${{ github.repository }}/releases/tag/latest"
          curl -fsSL "${AUTH[@]}" \
            -H "Title: 🔐 Bitwarden (icon) updated" \
            -H "Tags: white_check_mark,package" \
            -H "Priority: default" \
            -H "Click: $REL" \
            -H "Actions: view, Open release, $REL" \
            -d "✅ v${{ steps.v.outputs.version }} signed & published.
          📦 Upstream: Bitwarden ${{ steps.v.outputs.upstream }}
          🦊 Firefox will auto-update within a day." \
            "$NTFY_URL" || echo "ntfy notify failed (ignored)"

      # 🚨 Cases 2 & 3 — any failure (build, sign, release, or anything else).
      - name: Notify failure (ntfy)
        if: failure() && env.NTFY_URL != ''
        run: |
          AUTH=(); [ -n "${NTFY_TOKEN:-}" ] && AUTH=(-H "Authorization: Bearer $NTFY_TOKEN")
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsSL "${AUTH[@]}" \
            -H "Title: 🚨 Bitwarden (icon) build FAILED" \
            -H "Tags: rotating_light" \
            -H "Priority: high" \
            -H "Click: $RUN" \
            -H "Actions: view, Open run logs, $RUN" \
            -d "❌ Workflow run #${{ github.run_number }} failed.
          ⚠️ Vault auto-updates are paused until this is fixed.
          🔎 Check the logs to see which step broke." \
            "$NTFY_URL" || echo "ntfy notify failed (ignored)"
