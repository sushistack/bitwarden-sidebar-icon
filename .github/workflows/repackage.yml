name: repackage

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # 매주 월요일 06:00 UTC — 업스트림 새 버전 확인

permissions:
  contents: write   # 릴리스
  pages: write      # GH Pages 배포 (updates.json + latest.xpi)
  id-token: write   # deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NTFY_URL: ${{ secrets.NTFY_URL }}       # 전체 토픽 URL (예: https://ntfy.sh/my-topic). 미설정 시 알림 스킵.
  NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}   # self-hosted 인증용 Bearer 토큰 (선택). 익명 publish 가능하면 불필요.

jobs:
  repackage:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick jq
          npm install --global web-ext

      - name: Repackage (swap icons only)
        env:
          BUILD_REV: ${{ github.run_number }}
        run: bash repackage.sh icon.png

      - name: Read versions
        id: v
        run: |
          echo "upstream=$(cat dist/UPSTREAM)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat dist/VERSION)"   >> "$GITHUB_OUTPUT"

      - name: Already released for this upstream?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          up="${{ steps.v.outputs.upstream }}"
          if gh release list --json tagName -q '.[].tagName' | grep -qE "^v${up//./\\.}(\.|$)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ upstream $up already released — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign with AMO (unlisted)
        if: steps.check.outputs.exists == 'false'
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          web-ext sign \
            --source-dir=dist/src \
            --artifacts-dir=./signed \
            --channel=unlisted \
            --api-key="$WEB_EXT_API_KEY" \
            --api-secret="$WEB_EXT_API_SECRET"

      - name: Assemble Pages site (updates.json + latest.xpi)
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p site
          cp signed/*.xpi site/latest.xpi
          ver="${{ steps.v.outputs.version }}"
          cat > site/updates.json <<EOF
          {
            "addons": {
              "bitwarden-icon@sushistack": {
                "updates": [
                  { "version": "$ver", "update_link": "https://deeplify.dev/bitwarden-sidebar-icon/latest.xpi" }
                ]
              }
            }
          }
          EOF

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.exists == 'false'
        with:
          path: site

      - name: Deploy Pages
        id: deploy
        if: steps.check.outputs.exists == 'false'
        uses: actions/deploy-pages@v4

      - name: Publish GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.v.outputs.version }}"
          gh release create "v$ver" signed/*.xpi \
            --title "v$ver" \
            --notes "Bitwarden ${{ steps.v.outputs.upstream }} 재포장 (아이콘만, 코드 무수정). 자동 업데이트: Pages updates.json."

      - name: Notify success (ntfy)
        if: steps.check.outputs.exists == 'false' && env.NTFY_URL != ''
        run: |
          AUTH=(); [ -n "${NTFY_TOKEN:-}" ] && AUTH=(-H "Authorization: Bearer $NTFY_TOKEN")
          curl -fsSL "${AUTH[@]}" \
            -H "Title: bitwarden-sidebar-icon" \
            -H "Tags: white_check_mark" \
            -d "✅ v${{ steps.v.outputs.version }} 서명·배포 완료 — Firefox 가 하루 안에 자동 업데이트." \
            "$NTFY_URL" || echo "ntfy 알림 실패 (무시)"

      - name: Notify failure (ntfy)
        if: failure() && env.NTFY_URL != ''
        run: |
          AUTH=(); [ -n "${NTFY_TOKEN:-}" ] && AUTH=(-H "Authorization: Bearer $NTFY_TOKEN")
          curl -fsSL "${AUTH[@]}" \
            -H "Title: bitwarden-sidebar-icon 실패" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -d "❌ 워크플로우 실패 — 금고 자동업데이트 멈춤. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "$NTFY_URL" || echo "ntfy 알림 실패 (무시)"
